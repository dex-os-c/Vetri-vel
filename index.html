<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Vetri Vel — Arc I: The Return</title>
<style>
:root{--gold:#e8c27a;--ink:rgba(18,10,8,.5);--edge:rgba(232,194,122,.6)}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:Georgia,serif;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
button,.pad{font-family:inherit}
.pad{position:fixed;display:flex;align-items:center;justify-content:center;border-radius:50%;color:var(--gold);background:var(--ink);border:1.5px solid var(--edge);
 box-shadow:0 4px 18px rgba(0,0,0,.45),inset 0 0 14px rgba(232,194,122,.12);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);touch-action:none;
 -webkit-tap-highlight-color:transparent;transition:transform .08s,background .08s,opacity .25s}
.pad svg{width:46%;height:46%;fill:currentColor}
.pad.on{transform:scale(.93);background:rgba(232,194,122,.35)}
#bl,#br{bottom:calc(26px + env(safe-area-inset-bottom,0px));width:86px;height:86px}
#bl{left:calc(22px + env(safe-area-inset-left,0px))}#br{left:calc(122px + env(safe-area-inset-left,0px))}
#atk{right:calc(26px + env(safe-area-inset-right,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));width:96px;height:96px;color:#ffd9a0}
#jmp{right:calc(138px + env(safe-area-inset-right,0px));bottom:calc(44px + env(safe-area-inset-bottom,0px));width:74px;height:74px}
#rn{right:calc(36px + env(safe-area-inset-right,0px));bottom:calc(142px + env(safe-area-inset-bottom,0px));width:62px;height:62px}
#rn.on2{background:rgba(232,194,122,.38)}
/* scene mode: one big walk button only, nothing else to confuse */
body[data-mode=scene] #bl,body[data-mode=scene] .free{display:none}
body[data-mode=scene] #br{left:auto;right:calc(34px + env(safe-area-inset-right,0px));width:104px;height:104px}
body[data-walk="0"] #br,body[data-walk="0"] #bl{opacity:0;pointer-events:none}
body[data-mode=scene][data-scn=intro] #br{display:none}
.top{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));display:flex;gap:8px}
#menuBtn,#skipBtn{width:44px;height:44px;border-radius:12px;color:var(--gold);background:var(--ink);border:1.5px solid var(--edge);font-size:20px;display:flex;align-items:center;justify-content:center;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);touch-action:manipulation}
#skipBtn{width:auto;padding:0 14px;font-size:14px;letter-spacing:.06em}
.top.l{left:calc(10px + env(safe-area-inset-left,0px))}.top.r{right:calc(10px + env(safe-area-inset-right,0px))}
body[data-mode=free] #skipBtn{display:none}
#menu{position:fixed;left:calc(10px + env(safe-area-inset-left,0px));top:calc(62px + env(safe-area-inset-top,0px));min-width:200px;padding:8px;border-radius:14px;background:rgba(18,10,8,.92);border:1.5px solid var(--edge);display:none;flex-direction:column;gap:4px;box-shadow:0 10px 30px rgba(0,0,0,.6)}
#menu.open{display:flex}
#menu button{background:none;border:0;color:#f3e4c2;font-size:16px;text-align:left;padding:11px 12px;border-radius:9px;touch-action:manipulation}
#menu button:active{background:rgba(232,194,122,.22)}
#menu hr{border:0;border-top:1px solid rgba(232,194,122,.25);margin:2px 0}
body[data-mode=scene] .freeonly{display:none}
</style></head><body>
<canvas id="c" width="960" height="540"></canvas>
<div class="top l"><button id="menuBtn" aria-label="Menu">&#9776;</button></div>
<div class="top r"><button id="skipBtn">SKIP &#9197;</button></div>
<div id="menu">
 <button data-p="KeyF">Switch: Story ⇄ Free play</button><button data-p="KeyR">Restart story</button>
 <hr class="freeonly"><button class="freeonly" data-p="KeyT">Talk pose</button><button class="freeonly" data-p="KeyY">Weary march</button>
 <button class="freeonly" data-p="KeyH">Take a hit</button><button class="freeonly" data-p="KeyK">Defeat</button>
</div>
<div class="pad" id="bl" data-k="ArrowLeft"><svg viewBox="0 0 24 24"><path d="M15.5 4 7 12l8.5 8 1.8-1.9L10.8 12l6.5-6.1z"/></svg></div>
<div class="pad" id="br" data-k="ArrowRight"><svg viewBox="0 0 24 24"><path d="M8.5 4 17 12l-8.5 8-1.8-1.9 6.5-6.1-6.5-6.1z"/></svg></div>
<div class="pad free" id="atk" data-k="KeyJ"><svg viewBox="0 0 24 24"><path d="M19.6 2.4 11 5l-6.6 8.9 2.5 1.8-3.5 3.9 1.3 1.3 3.9-3.5 1.8 2.5L17 12.3l2.6-8.6zM12.6 7.6l4.6-1.4-1.5 4.7-3.4 4.8-2.4-1.7z"/></svg></div>
<div class="pad free" id="jmp" data-k="Space"><svg viewBox="0 0 24 24"><path d="M12 3 4.5 11l1.8 1.8L12 7.1l5.7 5.7 1.8-1.8zM12 11.2 4.5 18.7 6.3 20.5 12 14.8l5.7 5.7 1.8-1.8z"/></svg></div>
<div class="pad free" id="rn"><svg viewBox="0 0 24 24"><path d="M4 5.5 12 12 4 18.5zM12 5.5 20 12 12 18.5z"/></svg></div>
<script src="game.js"></script>
<script>
const $=s=>document.querySelector(s);
document.querySelectorAll('.pad[data-k]').forEach(b=>{const k=b.dataset.k,
 on=e=>{e.preventDefault();e.stopPropagation();keys[k]=true;b.classList.add('on');if(navigator.vibrate)navigator.vibrate(8)},
 off=e=>{e.preventDefault();keys[k]=false;b.classList.remove('on')};
 b.addEventListener('pointerdown',on);['pointerup','pointercancel','pointerleave'].forEach(t=>b.addEventListener(t,off));b.addEventListener('contextmenu',e=>e.preventDefault())});
$('#rn').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();keys.ShiftLeft=!keys.ShiftLeft;$('#rn').classList.toggle('on',!!keys.ShiftLeft)});
$('#menuBtn').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();$('#menu').classList.toggle('open')});
document.querySelectorAll('#menu button').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();press(b.dataset.p);$('#menu').classList.remove('open')}));
$('#skipBtn').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();skipScene()});
addEventListener('pointerdown',e=>{if(!e.target.closest('#menu,#menuBtn'))$('#menu').classList.remove('open')});
</script></body></html>
